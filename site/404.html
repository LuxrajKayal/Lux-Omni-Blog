<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #171717;
            --primary: #DC2626;
            --primary-dark: #B91C1C;
            --accent: #EA580C;
            --gold: #F59E0B;
            --gold-light: #FBBF24;
            --glass: rgba(38, 38, 38, 0.82);
            --border: rgba(255, 255, 255, 0.12);
            --text: #FAFAFA;
            --muted: #A3A3A3;
            --game-bg: #1F1F1F;
            --ball: #FCA5A5;
            --paddle: #D97706;
            --overlay: rgba(23, 23, 23, 0.94);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: clamp(1rem, 4vw, 2rem);
            min-height: 100vh;
            min-height: 100svh;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            overflow-x: hidden;
            position: relative;
        }

        /* Background decorative elements */
        .blob {
            position: fixed;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
            pointer-events: none;
            animation: float 10s infinite ease-in-out;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: clamp(18rem, 40vw, 38rem);
            height: clamp(18rem, 40vw, 38rem);
            background: radial-gradient(circle, rgba(220, 38, 38, 0.24) 0%, transparent 70%);
        }

        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: clamp(20rem, 48vw, 46rem);
            height: clamp(20rem, 48vw, 46rem);
            background: radial-gradient(circle, rgba(234, 88, 12, 0.18) 0%, transparent 70%);
            animation-delay: -5s;
        }

        .container {
            position: relative;
            z-index: 1;
            width: min(100%, 560px);
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: clamp(1.25rem, 4vw, 2rem);
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .brand-lockup {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.45rem;
            width: min(100%, 560px);
            margin: 0 auto;
            text-align: center;
        }

        .brand-lockup__symbol {
            display: block;
            width: 42px;
            height: 42px;
            object-fit: contain;
        }

        .brand-lockup__wordmark {
            margin: 0;
            color: var(--primary);
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            line-height: 1;
        }

        .brand-lockup__tagline {
            margin: 0;
            color: var(--muted);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            line-height: 1.4;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(4.5rem, 16vw, 6rem);
            margin: 0;
            background: linear-gradient(to right, #DC2626, #B91C1C);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1;
            animation: pulse 2s infinite alternate;
        }

        p {
            color: var(--muted);
            font-size: clamp(1rem, 3vw, 1.15rem);
            line-height: 1.55;
            margin: 0 0 1.5rem;
        }

        /* Game Canvas Container */
        #game-container {
            position: relative;
            width: min(100%, 480px);
            margin: 0 auto 1.5rem;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: var(--game-bg);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 3 / 2;
            background: var(--game-bg);
            cursor: none;
            touch-action: none;
        }

        /* Game Over Overlay */
        #game-over {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            padding: 1rem;
            background: var(--overlay);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        #game-over.visible {
            display: flex;
        }

        #game-over h2 {
            color: var(--text);
            margin: 0;
        }

        #final-score {
            font-size: clamp(1.5rem, 6vw, 2rem);
            color: var(--gold-light);
            margin: 1rem 0;
        }

        .btn {
            display: inline-block;
            background: rgba(220, 38, 38, 0.12);
            color: #FCA5A5;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            border: 1px solid var(--primary);
            font-weight: 600;
            transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
            cursor: pointer;
            margin: 0.5rem;
        }

        .btn:hover {
            background: var(--primary);
            color: var(--text);
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.4);
            transform: scale(1.05);
        }

        .btn:focus-visible {
            outline: 2px solid var(--gold-light);
            outline-offset: 3px;
        }

        .score-display {
            position: absolute;
            top: 10px;
            left: 15px;
            color: var(--gold-light);
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 1rem;
            font-weight: 700;
            pointer-events: none;
            text-shadow: 0 1px 8px rgba(220, 38, 38, 0.45);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        @keyframes pulse {
            0% { filter: drop-shadow(0 0 10px rgba(220, 38, 38, 0.2)); }
            100% { filter: drop-shadow(0 0 25px rgba(245, 158, 11, 0.45)); }
        }

        @media (max-width: 560px) {
            body {
                align-items: flex-start;
                padding: 1rem 0.75rem;
            }

            .container {
                border-radius: 18px;
            }

            #game-container {
                border-radius: 10px;
            }

            .btn {
                padding: 0.7rem 1.2rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .blob,
            h1 {
                animation: none;
            }

            .btn {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    
    <div class="container">
        <h1>404</h1>
        <p>Looks like you're lost. Break some bricks while you're here.</p>
        
        <div id="game-container">
            <canvas id="gameCanvas" width="480" height="320"></canvas>
            <div class="score-display">Score: <span id="current-score">0</span></div>
            <div id="game-over">
                <h2>Game Over</h2>
                <div id="final-score">Score: 0</div>
                <button class="btn" onclick="initGame()">Play Again</button>
            </div>
        </div>

        <a href="/Lux-Omni-Blog/" class="btn">Go Back Home</a>
    </div>

    <div class="brand-lockup" role="group" aria-label="Lux Omni Blog identity">
        <img
            class="brand-lockup__symbol"
            src="/Lux-Omni-Blog/assets/images/brand/lux-Omni-Blog-Transparent-Symbol.svg"
            alt=""
            width="42"
            height="42"
        >
        <p class="brand-lockup__wordmark">LUX OMNI</p>
        <p class="brand-lockup__tagline">Technology. Without the noise.</p>
    </div>

    <script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const currentScoreEl = document.getElementById("current-score");
const gameOverScreen = document.getElementById("game-over");
const finalScoreEl = document.getElementById("final-score");

// Game variables
let ballRadius = 6;
let x, y, dx, dy;
let paddleHeight = 10;
let paddleWidth = 75;
let paddleX;
let rightPressed = false;
let leftPressed = false;

// Bricks
let brickRowCount = 5;
let brickColumnCount = 7;
let brickWidth = 55;
let brickHeight = 15;
let brickPadding = 10;
let brickOffsetTop = 40;
let brickOffsetLeft = 15;
let bricks = [];
let score = 0;
let animationId;
let isGameOver = false;

// Fixed-step simulation: preserve the original 60 FPS movement on every display.
const SIMULATION_STEP = 1 / 60;
const MAX_FRAME_DELTA = 0.25;
const PADDLE_SPEED = 420; // Equivalent to the original 7 pixels per 60 FPS frame.
let previousFrameTime = 0;
let timeAccumulator = 0;

// Colors
const paddleColor = "#EA580C";
const ballColor = "#DC2626";

function initBricks() {
    bricks = [];
    for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCount; r++) {
            bricks[c][r] = {
                x: (c * (brickWidth + brickPadding)) + brickOffsetLeft,
                y: (r * (brickHeight + brickPadding)) + brickOffsetTop,
                status: 1
            };
        }
    }
}

function initGame() {
    cancelAnimationFrame(animationId);
    isGameOver = false;
    gameOverScreen.classList.remove("visible");
    
    x = canvas.width / 2;
    y = canvas.height - 30;
    // 180 px/s per axis preserves the original 3 px per frame at 60 FPS.
    dx = 180;
    dy = -180;
    paddleX = (canvas.width - paddleWidth) / 2;
    score = 0;
    currentScoreEl.textContent = score;
    
    initBricks();
    previousFrameTime = performance.now();
    timeAccumulator = 0;
    animationId = requestAnimationFrame(draw);
}

// Controls
document.addEventListener("keydown", keyDownHandler, false);
document.addEventListener("keyup", keyUpHandler, false);
canvas.addEventListener("mousemove", mouseMoveHandler, false);
canvas.addEventListener("touchmove", touchMoveHandler, { passive: false });

function keyDownHandler(e) {
    if (e.key == "Right" || e.key == "ArrowRight") rightPressed = true;
    else if (e.key == "Left" || e.key == "ArrowLeft") leftPressed = true;
}

function keyUpHandler(e) {
    if (e.key == "Right" || e.key == "ArrowRight") rightPressed = false;
    else if (e.key == "Left" || e.key == "ArrowLeft") leftPressed = false;
}

function mouseMoveHandler(e) {
    const relativeX = e.clientX - canvas.getBoundingClientRect().left;
    if (relativeX > 0 && relativeX < canvas.width) {
        paddleX = relativeX - paddleWidth / 2;
    }
}

function touchMoveHandler(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const relativeX = e.touches[0].clientX - rect.left;
    if (relativeX > 0 && relativeX < rect.width) {
        const canvasX = relativeX * (canvas.width / rect.width);
        paddleX = canvasX - paddleWidth / 2;
    }
}

function collisionDetection() {
    for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
            let b = bricks[c][r];
            if (b.status == 1) {
                if (x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
                    dy = -dy;
                    b.status = 0;
                    score++;
                    currentScoreEl.textContent = score;
                    if (score == brickRowCount * brickColumnCount) {
                        // Win - reset bricks and increase speed slightly
                        initBricks();
                        // Preserve the original +0.5 px/frame increase at 60 FPS.
                        dy = Math.sign(dy) * (Math.abs(dy) + 30);
                        dx = Math.sign(dx) * (Math.abs(dx) + 30);
                    }
                }
            }
        }
    }
}

function drawBall() {
    ctx.beginPath();
    ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
    ctx.fillStyle = ballColor;
    ctx.shadowBlur = 10;
    ctx.shadowColor = ballColor;
    ctx.fill();
    ctx.closePath();
    ctx.shadowBlur = 0; // reset
}

function drawPaddle() {
    ctx.beginPath();
    ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
    ctx.fillStyle = paddleColor;
    ctx.shadowBlur = 15;
    ctx.shadowColor = paddleColor;
    ctx.fill();
    ctx.closePath();
    ctx.shadowBlur = 0;
}

function drawBricks() {
    for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
            if (bricks[c][r].status == 1) {
                let brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
                let brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
                bricks[c][r].x = brickX;
                bricks[c][r].y = brickY;
                ctx.beginPath();
                ctx.rect(brickX, brickY, brickWidth, brickHeight);
                // Gradient for bricks
                let grad = ctx.createLinearGradient(brickX, brickY, brickX, brickY + brickHeight);
                grad.addColorStop(0, "rgba(255,255,255,0.98)");
                grad.addColorStop(1, "rgba(245,245,245,0.88)");
                ctx.fillStyle = grad;
                ctx.strokeStyle = "rgba(255, 255, 255, 0.95)";
                ctx.fill();
                ctx.stroke();
                ctx.closePath();
            }
        }
    }
}

function updateGame() {
    // Check collisions once per fixed physics step, not once per rendered frame.
    collisionDetection();

    const nextX = x + dx * SIMULATION_STEP;
    const nextY = y + dy * SIMULATION_STEP;

    // Wall collision
    if (nextX > canvas.width - ballRadius || nextX < ballRadius) {
        dx = -dx;
    }

    if (nextY < ballRadius) {
        dy = -dy;
    } else if (nextY > canvas.height - ballRadius) {
        if (x > paddleX && x < paddleX + paddleWidth) {
            // Keep the original paddle-angle response, converted to pixels per second.
            const hitPoint = x - (paddleX + paddleWidth / 2);
            dx = hitPoint * 6;
            dy = -dy;
        } else {
            isGameOver = true;
            gameOverScreen.classList.add("visible");
            finalScoreEl.textContent = `Score: ${score}`;
            return;
        }
    }

    if (rightPressed && paddleX < canvas.width - paddleWidth) {
        paddleX += PADDLE_SPEED * SIMULATION_STEP;
    } else if (leftPressed && paddleX > 0) {
        paddleX -= PADDLE_SPEED * SIMULATION_STEP;
    }

    x += dx * SIMULATION_STEP;
    y += dy * SIMULATION_STEP;
}

function renderGame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBricks();
    drawBall();
    drawPaddle();
}

function draw(timestamp) {
    if (isGameOver) return;

    const elapsed = Math.max(
        0,
        Math.min((timestamp - previousFrameTime) / 1000, MAX_FRAME_DELTA)
    );
    previousFrameTime = timestamp;
    timeAccumulator += elapsed;

    // Catch up with elapsed time when the browser renders fewer frames.
    while (timeAccumulator + 1e-8 >= SIMULATION_STEP && !isGameOver) {
        updateGame();
        timeAccumulator = Math.max(0, timeAccumulator - SIMULATION_STEP);
    }

    renderGame();

    if (!isGameOver) {
        animationId = requestAnimationFrame(draw);
    }
}

// Start game
initGame();
    </script>
</body>
</html>
