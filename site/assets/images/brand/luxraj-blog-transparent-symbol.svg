<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- BACKGROUND AND RIM GRADIENTS -->
    <linearGradient id="rimBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#881337" />
      <stop offset="100%" stop-color="#6B0F2B" />
    </linearGradient>

    <radialGradient id="crimsonCanvas" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#B91C1C" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4C0519" />
    </radialGradient>

    <radialGradient id="ambientCoreGlow" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#EA580C" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#881337" stop-opacity="0" />
    </radialGradient>

    <!-- BOTTOM LAYER GRADIENTS -->
    <linearGradient id="botTopSurf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#DC2626" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#881337" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="botInnerRecess" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>

    <linearGradient id="botWallLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="85%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <linearGradient id="botWallRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#6B0F2B" />
    </linearGradient>

    <!-- MIDDLE LAYER GRADIENTS (Translucent Glass so Column Shows Through) -->
    <linearGradient id="midTopSurf" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.72" />
      <stop offset="50%" stop-color="#EA580C" stop-opacity="0.68" />
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0.72" />
    </linearGradient>

    <linearGradient id="midInnerTray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#B91C1C" stop-opacity="0.68" />
    </linearGradient>

    <linearGradient id="midWallLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.85" />
      <stop offset="90%" stop-color="#D97706" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <linearGradient id="midWallRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.85" />
    </linearGradient>

    <!-- CENTRAL GLOWING PILLAR GRADIENTS -->
    <linearGradient id="pillarLeftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="1" />
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.95" />
      <stop offset="85%" stop-color="#EA580C" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="pillarRightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#EA580C" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#DC2626" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#881337" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="pillarCenterBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="1" />
      <stop offset="55%" stop-color="#FBBF24" stop-opacity="0.95" />
      <stop offset="85%" stop-color="#EA580C" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0" />
    </linearGradient>

    <!-- TOP SPLIT LAYER GRADIENTS (Translucent Glass on Lower Arm) -->
    <linearGradient id="topLeftWingGrad" x1="20%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.92" />
      <stop offset="35%" stop-color="#D97706" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#EA580C" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0.72" />
    </linearGradient>

    <linearGradient id="topRightWingGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.92" />
    </linearGradient>

    <linearGradient id="topLeftWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.88" />
      <stop offset="65%" stop-color="#DC2626" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#881337" stop-opacity="0.82" />
    </linearGradient>

    <linearGradient id="topRightWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="glossSweep" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.62" />
      <stop offset="50%" stop-color="#FDE68A" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="amberRimLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFFBEB" stop-opacity="1" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="crimsonRimLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCA5A5" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FECACA" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.75" />
    </linearGradient>

    <!-- FILTERS -->
    <filter id="deepCrimsonDrop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#4C0519" flood-opacity="0.9" />
    </filter>

    <filter id="midCrimsonDrop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#881337" flood-opacity="0.65" />
    </filter>

    <filter id="amberBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" />
    </filter>

    <clipPath id="topWingsClip">
      <path d="M 256 84 L 312 116.5 L 256 149 L 196 184 L 256 219 L 312 251.5 L 256 284 L 84 184 Z
               M 326 124.7 L 428 184 L 326 243.3 L 270 210.8 L 316 184 L 270 157.2 Z" />
    </clipPath>
  </defs>

  

  <!-- 2. BOTTOM LAYER -->
  <g filter="url(#deepCrimsonDrop)">
    <polygon points="84,332 256,432 256,456 84,356" fill="url(#botWallLeft)" />
    <polygon points="256,432 428,332 428,356 256,456" fill="url(#botWallRight)" />

    <path fill="url(#botTopSurf)" fill-rule="evenodd" d="M 256 232 L 428 332 L 256 432 L 84 332 Z
             M 256 299.5 L 312 332 L 256 364.5 L 200 332 Z" />

    <path fill="url(#botInnerRecess)" fill-rule="evenodd" d="M 256 250 L 396 332 L 256 414 L 116 332 Z
             M 256 299.5 L 312 332 L 256 364.5 L 200 332 Z" />

    <polygon points="256,299.5 312,332 256,364.5 200,332" fill="#6B0F2B" fill-opacity="0.9" />
    <polygon points="256,299.5 200,332 200,346 256,313.5" fill="#881337" />
    <polygon points="256,299.5 312,332 312,346 256,313.5" fill="#991B1B" />

    <polygon points="226,314.5 256,299.5 256,364.5 226,347" fill="#EA580C" fill-opacity="0.45" />
    <polygon points="256,299.5 286,314.5 286,347 256,364.5" fill="#DC2626" fill-opacity="0.45" />

    <polyline points="84,332 256,432 428,332" fill="none" stroke="url(#crimsonRimLight)" stroke-width="3" stroke-linecap="round" />
    <line x1="256" y1="432" x2="256" y2="456" stroke="#FCA5A5" stroke-width="2" stroke-opacity="0.6" />
  </g>

  <!-- 3. LOWER PILLAR SEGMENT (EXTENDED UP TO CONNECT SEAMLESSLY) -->
  <g>
    <rect x="228" y="225" width="56" height="125" fill="#EA580C" fill-opacity="0.45" filter="url(#softGlow)" />
    <polygon points="226,225 256,242.5 256,360 226,342.5" fill="url(#pillarLeftFace)" fill-opacity="0.9" />
    <polygon points="256,242.5 286,225 286,342.5 256,360" fill="url(#pillarRightFace)" fill-opacity="0.9" />
    <line x1="256" y1="242.5" x2="256" y2="358" stroke="url(#pillarCenterBeam)" stroke-width="4" filter="url(#amberBloom)" />
  </g>

  <!-- 4. MIDDLE LAYER (TRANSLUCENT GLASS SO PILLAR GLOWS THROUGH) -->
  <g filter="url(#midCrimsonDrop)">
    <polygon points="84,256 256,356 256,378 84,278" fill="url(#midWallLeft)" />
    <polygon points="256,356 428,256 428,278 256,378" fill="url(#midWallRight)" />

    <path fill="url(#midTopSurf)" fill-rule="evenodd" d="M 256 156 L 428 256 L 256 356 L 84 256 Z
             M 256 223.5 L 312 256 L 256 288.5 L 200 256 Z" />

    <path fill="url(#midInnerTray)" fill-rule="evenodd" d="M 256 174 L 396 256 L 256 338 L 116 256 Z
             M 256 223.5 L 312 256 L 256 288.5 L 200 256 Z" />

    <polygon points="256,223.5 200,256 200,270 256,237.5" fill="#991B1B" fill-opacity="0.65" />
    <polygon points="256,223.5 312,256 312,270 256,237.5" fill="#B91C1C" fill-opacity="0.65" />
    <polygon points="256,223.5 312,256 256,288.5 200,256" fill="none" stroke="#FBBF24" stroke-width="2" stroke-opacity="0.85" />

    <polyline points="84,256 256,156 428,256" fill="none" stroke="#FDE68A" stroke-width="2" stroke-opacity="0.6" />
    <polyline points="84,256 256,356 428,256" fill="none" stroke="url(#amberRimLight)" stroke-width="3.5" stroke-linecap="round" filter="url(#amberBloom)" />
    <line x1="256" y1="356" x2="256" y2="378" stroke="#FFFBEB" stroke-width="2.5" stroke-opacity="0.9" />
  </g>

  <!-- 5. UPPER CENTRAL GLOWING PILLAR -->
  <g>
    <rect x="228" y="135" width="56" height="145" fill="#F59E0B" fill-opacity="0.55" filter="url(#softGlow)" />
    <polygon points="226,144 256,161.5 256,288 226,270.5" fill="url(#pillarLeftFace)" />
    <polygon points="256,161.5 286,144 286,270.5 256,288" fill="url(#pillarRightFace)" />
    <polygon points="256,126.5 286,144 256,161.5 226,144" fill="#FDE68A" stroke="#FFFBEB" stroke-width="1.5" />
    <polygon points="256,131 278,144 256,157 234,144" fill="#D97706" fill-opacity="0.7" />
    <line x1="256" y1="161.5" x2="256" y2="288" stroke="url(#pillarCenterBeam)" stroke-width="4.5" filter="url(#amberBloom)" />
  </g>

  <!-- 6. TOP SPLIT LAYER -->
  <g filter="url(#midCrimsonDrop)">
    <!-- Right Split Chevron Wing -->
    <polygon points="270,210.8 326,243.3 326,263.3 270,230.8" fill="#D97706" fill-opacity="0.55" stroke="#FBBF24" stroke-width="1" stroke-opacity="0.5" />
    <polygon points="326,243.3 428,184 428,204 326,263.3" fill="url(#topRightWall)" />
    <polygon points="270,157.2 316,184 316,198 270,171.2" fill="#B45309" fill-opacity="0.85" />

    <path fill="url(#topRightWingGrad)" d="M 326 124.7
             L 428 184
             L 326 243.3
             L 270 210.8
             L 316 184
             L 270 157.2
             Z" />

    <polyline points="270,157.2 326,124.7 428,184" fill="none" stroke="#FFFBEB" stroke-width="2.5" stroke-opacity="0.85" />
    <polyline points="270,210.8 326,243.3 428,184" fill="none" stroke="url(#amberRimLight)" stroke-width="3.5" stroke-linecap="round" filter="url(#amberBloom)" />
    <line x1="326" y1="243.3" x2="326" y2="263.3" stroke="#FFFBEB" stroke-width="2" stroke-opacity="0.85" />

    <!-- Left C-Shape Wing -->
    <polygon points="196,184 256,149 256,163 196,198" fill="#991B1B" fill-opacity="0.7" />
    <polygon points="256,149 312,116.5 312,130.5 256,163" fill="#B45309" fill-opacity="0.7" />

    <polygon points="84,184 256,284 256,300 84,200" fill="url(#topLeftWall)" />
    <polygon points="256,284 312,251.5 312,267.5 256,300" fill="#881337" fill-opacity="0.82" />

    <path fill="url(#topLeftWingGrad)" d="M 256 84
             L 312 116.5
             L 256 149
             L 196 184
             L 256 219
             L 312 251.5
             L 256 284
             L 84 184
             Z" />

    <!-- Curved Specular Glass Reflection -->
    <g clip-path="url(#topWingsClip)">
      <path fill="url(#glossSweep)" d="M 60 60
               L 450 60
               L 450 190
               Q 260 215 80 186
               Z" />
      <path fill="none" stroke="#FFFBEB" stroke-width="1.5" stroke-opacity="0.45" d="M 80 186 Q 260 215 450 190" />
    </g>

    <!-- Left Wing Chamfered Rim Highlights -->
    <polyline points="84,184 256,84 312,116.5" fill="none" stroke="url(#amberRimLight)" stroke-width="3" stroke-linecap="round" />
    <polyline points="312,116.5 256,149 196,184 256,219 312,251.5" fill="none" stroke="#FDE68A" stroke-width="2" stroke-opacity="0.7" />
    <polyline points="84,184 256,284 312,251.5" fill="none" stroke="url(#crimsonRimLight)" stroke-width="3" stroke-linecap="round" />
    <line x1="256" y1="284" x2="256" y2="300" stroke="#FCA5A5" stroke-width="2" stroke-opacity="0.85" />
  </g>
</svg>